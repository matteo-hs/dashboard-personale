<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3B5BDB">
<title>Dashboard H&amp;S</title>
<link rel="stylesheet" href="css/app.css">
<script>
  // Applica il tema prima del rendering per evitare lampi di colore
  (function () {
    var v = 'auto';
    try { v = localStorage.getItem('hs-theme') || 'auto'; } catch (e) {}
    var dark = v === 'dark' || (v === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="brand" href="#/dashboard">
      <div class="brand-mark">H&amp;S</div>
      <div>
        <div class="brand-name">Dashboard</div>
        <div class="brand-sub">Matteo · Hub&amp;Start</div>
      </div>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="ver-pill">v0.1.1 · prototipo locale</div>
    </div>
  </aside>
  <main class="main" id="main"></main>
  <nav class="bottom-nav" id="bottom-nav"></nav>
</div>
<div id="toasts" class="toasts"></div>

<script src="js/utils.js"></script>
<script src="js/store.js"></script>
<script src="js/components.js"></script>
<script src="js/view-dashboard.js"></script>
<script src="js/view-mail.js"></script>
<script src="js/view-agenda.js"></script>
<script src="js/view-calendar.js"></script>
<script src="js/view-settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
